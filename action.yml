name: Plumbline
description: Lint Soroban smart contracts and annotate the pull request with what it finds.
author: Plumbline contributors

branding:
  icon: check-square
  color: blue

inputs:
  paths:
    description: |
      Files or directories to lint, whitespace or newline separated.
      Directories are walked for .rs sources.
    required: false
    default: "."
  fail-on:
    description: |
      Lowest severity that fails the run: error, warning, note, or never.
      Findings below the threshold are still annotated.
    required: false
    default: error
  format:
    description: |
      Output format. "github" emits the workflow commands that become inline
      annotations; "text" is easier to read when debugging a workflow; "json"
      is for a later step that wants to do something with the findings.
    required: false
    default: github
  config:
    description: |
      Path to a Plumbline configuration file. Defaults to .plumbline.toml in
      the repository root when that file exists, and to Plumbline's own
      defaults when it does not.
    required: false
    default: ""

outputs:
  findings:
    description: |
      Number of findings reported. Only populated when format is "github",
      which is the default; other formats leave it empty.
    value: ${{ steps.plumbline.outputs.findings }}
  exit-code:
    description: The linter's exit code — 0 clean, 1 findings at or above fail-on.
    value: ${{ steps.plumbline.outputs.exit-code }}

runs:
  using: composite
  steps:
    # github.action_path is "." when the action is used from the repository
    # that defines it (uses: ./), which yields patterns like ".//go.sum" that
    # the cache backend rejects for containing relative path segments.
    # Resolving it here makes both the local and the published case absolute.
    - name: Resolve the action path
      id: resolve
      shell: bash
      run: |
        root=$(cd "${{ github.action_path }}" && pwd)
        {
          echo "gomod=${root}/go.mod"
          echo "gosum=${root}/go.sum"
          echo "root=${root}"
        } >>"$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Tracks the Go version Plumbline itself declares, so the action
        # cannot drift from the module it builds.
        go-version-file: ${{ steps.resolve.outputs.gomod }}
        cache-dependency-path: ${{ steps.resolve.outputs.gosum }}

    - name: Run Plumbline
      id: plumbline
      shell: bash
      run: ${{ github.action_path }}/action/run.sh
      env:
        PLUMBLINE_ACTION_PATH: ${{ steps.resolve.outputs.root }}
        PLUMBLINE_PATHS: ${{ inputs.paths }}
        PLUMBLINE_FAIL_ON: ${{ inputs.fail-on }}
        PLUMBLINE_FORMAT: ${{ inputs.format }}
        PLUMBLINE_CONFIG: ${{ inputs.config }}
