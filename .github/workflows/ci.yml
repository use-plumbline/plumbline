name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The Rust grammar is linked through cgo, so the race detector is
      # checking the boundary as much as the Go code.
      - name: go test -race
        run: go test -race ./...

      # The version is pinned rather than tracking latest so the binary and
      # .golangci.yml cannot drift apart without someone choosing to. The
      # config is written against the v2 schema; a v1 binary rejects it
      # outright, and a newer v2 binary can start enforcing rules nobody in
      # this repository decided to adopt. Either way the failure would arrive
      # on an unrelated pull request and look like that author's problem.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Plumbline lints its own sample contract with its own action. The
      # sample is idiomatic Soroban, so anything reported here is a false
      # positive — which is why the threshold is warning rather than error.
      - name: Lint the sample contract
        id: sample
        uses: ./
        with:
          paths: testdata/sample-contract
          fail-on: warning

      - name: The sample contract must be completely clean
        run: |
          if [ "${{ steps.sample.outputs.findings }}" != "0" ]; then
            echo "Plumbline reported ${{ steps.sample.outputs.findings }} finding(s) on idiomatic Soroban code."
            exit 1
          fi

      # The other direction: prove the rules actually fire, end to end
      # through the real binary, not just in the rule unit tests.
      - name: Findings must fail the run
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/plumbline" ./cmd/plumbline
          set +e
          "$RUNNER_TEMP/plumbline" testdata/rules/missing-auth/fail.rs >"$RUNNER_TEMP/out.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/out.txt"
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1 on a contract with defects, got $status"
            exit 1
          fi
          grep -q 'missing-auth' "$RUNNER_TEMP/out.txt"

      - name: Shell scripts must be valid
        run: shellcheck action/run.sh corpus/run.sh

  contract:
    name: Sample contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testdata/sample-contract
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: testdata/sample-contract

      # The sample contract is what Plumbline claims good Soroban looks like.
      # Compiling and testing it is what stops that claim from drifting away
      # from the real soroban-sdk.
      - name: cargo test
        run: cargo test

  # Plumbline's claim is that its rules stay quiet on correct code. The corpus
  # is where that claim is either true or false, so it is a required check
  # rather than something a release remembers to do.
  #
  # The corpus is pinned by commit in corpus/repos.txt, so the counts are
  # deterministic and only move when Plumbline moves. A diff against
  # corpus/baseline.txt therefore means this branch changed what Plumbline says
  # about 300-odd files of real third-party contracts — which is a thing to
  # decide on deliberately, not to find out about after a release.
  #
  # contractmeta-missing shipped in #27 firing on 96% of the corpus. Nothing in
  # CI could have told anyone that at the time. This job is that missing check.
  corpus:
    name: Corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Lint the pinned corpus
        run: make corpus-check

      # The four false-positive classes cut before v0.1.0 are pinned by unit
      # fixtures, which the Go job runs. This is the one that cannot be
      # expressed as a fixture: it asserts against real repositories that no
      # finding comes from a path the engine is supposed to skip. Test
      # scaffolding was 44 of the original 174 findings.
      - name: No finding may come from skipped test scaffolding
        run: |
          if grep -E '/(tests?)/|/tests?\.rs:' corpus/checkouts/.*.findings; then
            echo "A finding came from a path DiscoverRust is supposed to skip."
            echo "See docs/corpus-run.md, false-positive class 1."
            exit 1
          fi
          echo "No findings from skipped paths."
