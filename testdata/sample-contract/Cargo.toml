[package]
name = "plumbline-sample-vault"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "A sample Soroban contract that Plumbline lints in CI."

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
